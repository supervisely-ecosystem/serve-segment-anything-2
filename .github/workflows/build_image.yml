name: Docker Image Build

on:
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'Docker Image Tag (without "v"; default: the tag config.json names). A tag already on Docker Hub is kept, not rebuilt'
        required: false
        type: string
        default: ""

jobs:
  # The same build as a release's (release.yml): config.json's image, or a test tag, from the selected branch.
  docker-build-and-push:
    uses: supervisely-ecosystem/workflows/.github/workflows/build_image_from_template.yml@master
    secrets:
      DOCKERHUB_USERNAME: "${{ secrets.DOCKERHUB_USERNAME }}"
      DOCKERHUB_TOKEN: "${{ secrets.DOCKERHUB_TOKEN }}"
    with:
      tag_version: ${{ github.event.inputs.tag_version }}
      image_name: "segment-anything-2"
      dockerfile_template_path: "docker/Dockerfile"
      # zstd layers: a smaller download that unpacks faster; agents need Docker 23+ / containerd 1.5+
      compression: zstd
