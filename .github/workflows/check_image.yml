name: Image check
run-name: Image check of "${{ github.ref_name }}"
on:
  pull_request:
  push:
    branches:
      - main
      - master
permissions:
  contents: read
jobs:
  # config.json names the image of its version (supervisely/segment-anything-2:<version>), and docker/Dockerfile runs the
  # app from /app/repo with config.json's entrypoint as its CMD.
  Check-Image:
    runs-on: gha-runner-supervisely-ecosystem
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python3 docker/check_image.py
